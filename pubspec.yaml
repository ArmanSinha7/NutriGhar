name: nutrighar
description: NutriGhar — Your offline Indian Nutrition & Weight Management companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database (offline-first relational)
  sqflite: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0
  # Charts
  fl_chart: ^1.2.0

  # Animations
  lottie: ^3.1.2

  # Typography (Google Fonts)
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  # JSON
  json_annotation: ^4.9.0

  # Icons & UI
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/foods_seed.json
    - assets/data/facts_seed.json
    - assets/data/foods/
    - assets/images/

